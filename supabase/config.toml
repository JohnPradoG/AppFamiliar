# Config de Supabase CLI / integración con GitHub.
# OJO: aquí NO se declara [auth]: los ajustes de autenticación (registro público, redirecciones, correo) se manejan
# a mano en el panel (docs/PUBLICAR.md §A), para que un despliegue desde GitHub nunca los sobrescriba por accidente.
project_id = "appfamiliar"

[functions.invite-member]
verify_jwt = true                          # solo usuarios con sesión; además la función exige ser mamá

[functions.accept-invite]
verify_jwt = false                         # pública a propósito: la protege el código de un solo uso y el límite de intentos
